<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Садвокас Айдын</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(160deg, #e3f2fd, #f3e5f5);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }
        .wrapper {
            max-width: 520px;
            width: 100%;
            background: #fff;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.1);
            text-align: center;
        }
        h1 {
            color: #1a237e;
            margin-bottom: 6px;
            font-size: 1.8rem;
        }
        .subtitle {
            color: #666;
            margin-bottom: 32px;
            font-size: 1rem;
        }
        .links {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        a {
            display: block;
            padding: 16px 20px;
            border-radius: 12px;
            text-decoration: none;
            color: #fff;
            font-weight: 600;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }
        a:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }
        .link1 { background: linear-gradient(135deg, #5e35b1, #7e57c2); }
        .link2 { background: linear-gradient(135deg, #1565c0, #1976d2); }
        .link3 { background: linear-gradient(135deg, #0d47a1, #1565c0); }
    </style>
</head>
<body>
    <div class="wrapper">
        <h1>Садвокас Айдын</h1>
        <p class="subtitle">Мои проекты</p>
        <div class="links">
            <a href="portfolio.html" class="link1">Портфолио</a>
            <a href="product.html" class="link2">Карточка товара</a>
            <a href="college.html" class="link3">Колледж ВТК</a>
        </div>
    </div>
</body>
</html>
